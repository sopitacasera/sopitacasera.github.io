<svg width="760" height="406" viewBox="0 0 760 406" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .t { font-family: 'Fira Code','Cascadia Code',Consolas,'Courier New',monospace; font-size: 13px; }
      .ln { opacity: 0; animation: fa .18s ease forwards; }
      @keyframes fa { to { opacity: 1; } }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      .l01{animation-delay:.5s}  .l02{animation-delay:1.1s}
      .l03{animation-delay:1.6s} .l04{animation-delay:2.1s}
      .l05{animation-delay:2.6s} .l06{animation-delay:3.4s}
      .l07{animation-delay:4.0s} .l08{animation-delay:4.5s}
      .l09{animation-delay:5.0s} .l10{animation-delay:5.5s}
      .l11{animation-delay:6.1s} .l12{animation-delay:6.6s}
      .cur{opacity:0; animation: blink 1s step-start infinite; animation-delay:6.8s}
    </style>
    <linearGradient id="gbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>
  </defs>

  <rect width="760" height="406" rx="12" fill="url(#gbg)"/>
  <rect width="760" height="406" rx="12" fill="none" stroke="rgba(108,99,255,0.18)" stroke-width="1.5"/>

  <rect width="760" height="40" rx="12" fill="#161b22"/>
  <rect y="28" width="760" height="12" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57" opacity=".9"/>
  <circle cx="46" cy="20" r="6" fill="#ffbd2e" opacity=".9"/>
  <circle cx="68" cy="20" r="6" fill="#28c840" opacity=".9"/>
  <text x="380" y="25" text-anchor="middle" font-family="'Inter',system-ui,sans-serif" font-size="11.5" fill="#6b7990" letter-spacing="1.2">mcp-notary  ·  pre-install verification</text>

  <text class="ln l01 t" y="68">
    <tspan x="20" fill="#6b7990">❯ </tspan><tspan fill="#6C63FF">mcp-notary</tspan><tspan fill="#e6edf3"> check @modelcontextprotocol/server-filesystem</tspan>
  </text>
  <text class="ln l02 t" y="90">
    <tspan x="20" fill="#3fb950">  ✓ </tspan><tspan fill="#a8b3cf">Typosquatting   </tspan><tspan fill="#3fb950">no matches</tspan>
  </text>
  <text class="ln l03 t" y="110">
    <tspan x="20" fill="#6b7990">  · </tspan><tspan fill="#a8b3cf">Provenance      </tspan><tspan fill="#6b7990">UNKNOWN — no signed manifest found</tspan>
  </text>
  <text class="ln l04 t" y="130">
    <tspan x="20" fill="#6b7990">  exit </tspan><tspan fill="#3fb950">0</tspan>
  </text>

  <text class="ln l05 t" y="166" fill="#21262d"><tspan x="20">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</tspan></text>

  <text class="ln l06 t" y="196">
    <tspan x="20" fill="#6b7990">❯ </tspan><tspan fill="#6C63FF">mcp-notary</tspan><tspan fill="#e6edf3"> check @modelcontextprotocol/server-filesytem@1.2.0</tspan>
  </text>
  <text class="ln l07 t" y="218">
    <tspan x="20" fill="#f85149">  ✗ </tspan><tspan fill="#a8b3cf">Typosquatting   </tspan><tspan fill="#f85149">WARNING</tspan><tspan fill="#e6edf3">  looks like </tspan><tspan fill="#d29922">filesystem-mcp</tspan><tspan fill="#6b7990">  (distance 1)</tspan>
  </text>
  <text class="ln l08 t" y="236">
    <tspan x="36" fill="#6b7990">→ "filesytem" vs "filesystem" — one character off</tspan>
  </text>
  <text class="ln l09 t" y="256">
    <tspan x="20" fill="#6b7990">  · </tspan><tspan fill="#a8b3cf">Provenance      </tspan><tspan fill="#6b7990">UNKNOWN — no signed manifest found</tspan>
  </text>

  <g class="ln l10">
    <rect x="20" y="274" width="76" height="20" rx="4" fill="rgba(248,81,73,0.13)"/>
    <text class="t" y="288">
      <tspan x="58" text-anchor="middle" fill="#f85149" font-weight="bold">BLOCKED</tspan>
      <tspan x="106" fill="#6b7990">exit </tspan><tspan fill="#f85149">1</tspan><tspan fill="#6b7990">  ·  do not install — verify the package name</tspan>
    </text>
  </g>

  <text class="ln l11 t" y="320">
    <tspan x="20" fill="#6b7990">SARIF → </tspan><tspan fill="#2E9EF7">--sarif</tspan><tspan fill="#6b7990">  for the GitHub Security tab</tspan>
  </text>
  <text class="ln l12 t" y="346" fill="#6b7990"><tspan x="20">❯ </tspan></text>
  <rect class="cur" x="36" y="333" width="8" height="14" rx="1" fill="#6C63FF"/>
</svg>
